<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retell AI Web Call Test</title>
    <script src="https://cdn.jsdelivr.net/npm/retell-client-js-sdk@latest/dist/retell-client-js-sdk.umd.js"></script>
</head>
<body>
    <h1>Retell AI Web Call Test</h1>
    <div id="status">Ready to test web call</div>
    <button id="startCall" onclick="startWebCall()">Start Web Call</button>
    <div id="logs"></div>

    <script>
        let retellWebClient;
        
        function log(message) {
            const logs = document.getElementById('logs');
            logs.innerHTML += `<div>${new Date().toISOString()}: ${message}</div>`;
            console.log(message);
        }

        async function startWebCall() {
            const status = document.getElementById('status');
            const button = document.getElementById('startCall');
            
            button.disabled = true;
            status.textContent = 'Creating web call...';
            
            try {
                // First, create a web call via your backend
                const response = await fetch('/calls/start', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        driver_name: 'Test Driver',
                        load_number: 'TEST-123',
                        phone_number: 'WEB_CALL'
                    })
                });

                const result = await response.json();
                log(`Backend response: ${JSON.stringify(result, null, 2)}`);

                if (result.status === 'success' && result.access_token) {
                    status.textContent = 'Starting web call...';
                    
                    // Initialize Retell Web Client
                    retellWebClient = new RetellWebClient();
                    
                    // Set up event listeners
                    retellWebClient.on('call_started', () => {
                        log('Call started successfully!');
                        status.textContent = 'Call started - speak now!';
                    });
                    
                    retellWebClient.on('call_ended', () => {
                        log('Call ended');
                        status.textContent = 'Call ended';
                        button.disabled = false;
                    });
                    
                    retellWebClient.on('error', (error) => {
                        log(`Error: ${error.message}`);
                        status.textContent = `Error: ${error.message}`;
                        button.disabled = false;
                    });
                    
                    // Start the call using the access token
                    await retellWebClient.startCall({
                        accessToken: result.access_token
                    });
                    
                } else {
                    throw new Error(`Failed to create web call: ${result.error || 'Unknown error'}`);
                }
                
            } catch (error) {
                log(`Error: ${error.message}`);
                status.textContent = `Error: ${error.message}`;
                button.disabled = false;
            }
        }

        // Test direct URL approach
        function testDirectURL() {
            const accessToken = 'eyJhbGciOiJIUzI1NiJ9.eyJ2aWRlbyI6eyJyb29tSm9pbiI6dHJ1ZSwicm9vbSI6IndlYl9jYWxsXzhhYzE5NWEyZmMwNzcyYjFmNzU5YWE3MjJkZiJ9LCJpc3MiOiJBUElqWGZBMzVHTmM3WHgiLCJleHAiOjE3NjA0NTgyODUsIm5iZiI6MCwic3ViIjoiY2xpZW50In0.TndQ9NGgzBngYzFN7qc0sNYHaOoX3mwk0Jffh4O8Avk';
            const testURL = `https://retell.ai/web-call/${accessToken}`;
            log(`Testing direct URL: ${testURL}`);
            window.open(testURL, '_blank');
        }

        // Add test button for direct URL
        document.addEventListener('DOMContentLoaded', function() {
            const testButton = document.createElement('button');
            testButton.textContent = 'Test Direct URL';
            testButton.onclick = testDirectURL;
            document.body.appendChild(testButton);
        });
    </script>
</body>
</html>
