<html lang="en">

    <title>frontend</title>
    <!-- Development fallback: Tailwind Play CDN to get immediate styling in the browser. Remove when PostCSS build is fixed. -->

        document.write('<script src="https://cdn.tailwindcss.com"><\/script>');
        document.write('<script>tailwind.config = { darkMode: "class", theme: { extend: { colors: { primary: "#6d28d9", accent: "#06b6d4" } } } }<\/script>');
      }
    </script>
  </head>

    <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  </body>
